[project]
name = "ivy-website-backend"
version = "0.1.0"
description = "常春藤官網後台 API（獨立於園務系統）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "bcrypt>=5.0,<6",
    "httpx>=0.27,<0.28",
    "greenlet>=3.0,<4",
    "pillow>=13.0,<14",
    "python-multipart>=0.0.9,<0.1",
    "authlib>=1.8,<2",
    "itsdangerous>=2.2,<3",
    "boto3>=1.35,<2",
    "http-ece>=1.2.1,<2",
    "py-vapid>=1.9.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "aiosqlite>=0.20,<0.21",
    "moto[s3]>=5.0,<6",
    "pytest-split>=0.11,<0.12",
    "xlrd>=2.0,<3",
    "xlwt>=1.3,<2",
]
# 只有本機 extract（讀園方歷年註冊的 .xls）會用；正式站映像不裝。
extract = ["xlrd>=2.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio 1.x 不設會出棄用警告；function 與 0.23 時每個測試各自一個 event loop 的行為相同（2026-11-05 升 pytest 9）。
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
