[project]
name = "ivy-website-backend"
version = "0.1.0"
description = "常春藤官網後台 API（獨立於園務系統）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<4.1",
    "httpx>=0.27,<0.28",
    "greenlet>=3.0,<4",
    "pillow>=10.4,<11",
    "python-multipart>=0.0.9,<0.1",
    "authlib>=1.8,<2",
    "itsdangerous>=2.2,<3",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.24",
    "aiosqlite>=0.20,<0.21",
    "moto[s3]>=5.0,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
