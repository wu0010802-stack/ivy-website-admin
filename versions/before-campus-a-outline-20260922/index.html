<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>分校建築線稿｜位置比較</title>
  <link rel="icon" href="data:,">
  <style>
    :root{--paper:#f9f8f4;--surface:#eeeee8;--ink:#3d5057;--muted:#786c5c;--line:#cdd3d0}
    body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.7 'PingFang TC','Microsoft JhengHei',sans-serif}
    main{max-width:1520px;margin:auto;padding:40px 36px 52px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
    h1{font:500 28px/1.5 'Songti TC','Noto Serif TC',serif;letter-spacing:.07em;margin:0 0 5px}
    p{margin:0;color:var(--muted);font-size:13px}
    .views{display:flex;gap:10px}
    button,a{font:inherit;color:inherit}
    button{background:transparent;border:1px solid var(--line);border-radius:99px;min-height:44px;padding:6px 18px;cursor:pointer}
    button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    :is(a,button):focus-visible{outline:2px solid var(--ink);outline-offset:4px}
    .comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    article{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .caption{padding:20px 24px 17px;border-bottom:1px solid var(--line)}
    h2{margin:0 0 3px;font-size:19px;font-weight:500;letter-spacing:.03em}
    .caption a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;gap:14px}
    .caption a:hover{text-decoration:underline;text-underline-offset:5px}
    .letter{font:italic 26px Georgia,serif;color:var(--muted)}
    .stage{display:flex;justify-content:center;align-items:flex-start}
    .stage img{display:block;width:100%;height:auto}
    .stage .mobile{display:none}
    [data-view=mobile] .stage .desktop{display:none}
    [data-view=mobile] .stage .mobile{display:block;width:min(100%,390px)}
    [data-view=mobile] .stage{padding-block:22px;background:var(--surface)}
    footer{margin-top:23px;font-size:12px;color:var(--muted)}
    @media(max-width:700px){main{padding:24px 16px}.intro{display:block}.views{margin-top:16px}.comparison{grid-template-columns:1fr;gap:20px}.caption{padding:16px 20px}h1{font-size:24px}}
  </style>
</head>
<body data-view="desktop">
  <main>
    <header class="intro">
      <div><h1>把校園的輪廓，放回分校資訊</h1><p>兩款位置比較 · 沿用原有五校線稿、明體標題與圓角照片</p></div>
      <div class="views" role="group" aria-label="比較尺寸"><button data-view="desktop" aria-pressed="true">桌機</button><button data-view="mobile" aria-pressed="false">手機</button></div>
    </header>
    <div class="comparison">
      <article>
        <div class="caption"><h2><a href="preview.html?layout=a"><span class="letter">A</span>校名小線稿 <span aria-hidden="true">↗</span></a></h2><p>五校建築並排於校名上方，選取的校區線稿加深。</p></div>
        <a class="stage" href="preview.html?layout=a" aria-label="開啟 A 校名小線稿互動預覽"><img class="desktop" src="screenshots/a-desktop.png" alt="A 桌機版，五校名稱上方各自搭配小幅建築線稿"><img class="mobile" src="screenshots/a-mobile.png" alt="A 手機版，五校線稿與校名維持一列"></a>
      </article>
      <article>
        <div class="caption"><h2><a href="preview.html?layout=b"><span class="letter">B</span>右上角線稿 <span aria-hidden="true">↗</span></a></h2><p>目前校區的建築放在標題右側，與照片同步切換。</p></div>
        <a class="stage" href="preview.html?layout=b" aria-label="開啟 B 右上角線稿互動預覽"><img class="desktop" src="screenshots/b-desktop.png" alt="B 桌機版，目前校區的線稿放在分校區塊右上角"><img class="mobile" src="screenshots/b-mobile.png" alt="B 手機版，線稿放在雙語標題右側"></a>
      </article>
    </div>
    <footer>點選任一方案可切換五校、播放輪播。此為獨立 mock-up，尚未套用官網。</footer>
  </main>
  <script>
    document.querySelectorAll('button[data-view]').forEach(button => button.addEventListener('click', () => {
      document.body.dataset.view = button.dataset.view;
      document.querySelectorAll('button[data-view]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
  </script>
</body>
</html>
