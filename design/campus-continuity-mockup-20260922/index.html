<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>首頁 → 分校內頁｜視覺銜接 mock-up</title>
  <link rel="icon" href="../../web/public/favicon-48.png">
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,'PingFang TC',sans-serif;color:#263e34;background:#e6eae5}button,select,a{font:inherit;color:inherit}button,select{min-height:40px;border:1px solid #c3ccc3;border-radius:8px;background:#f9faf6;padding:7px 12px;cursor:pointer}a{color:inherit;text-underline-offset:4px}button[aria-pressed=true]{background:#294638;color:#fffdf5;border-color:#294638}.toolbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px;border-bottom:1px solid #cbd1c9;background:#f8faf5}.title strong{display:block;font-size:16px}.title small{font-size:12px;color:#657266}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.segmented{display:flex;gap:4px}.frame-area{height:calc(100dvh - 95px);min-height:400px;display:flex;justify-content:center;padding:12px 16px 16px}iframe{width:100%;height:100%;background:#fafaf6;border:1px solid #c8cfc5;border-radius:8px}.frame-area[data-device=mobile] iframe{width:390px;border-radius:24px;box-shadow:0 12px 35px #243a2b20}.notes{font-size:12px;color:#68766a;margin-top:3px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8f6429;outline-offset:3px}@media(max-width:980px){.toolbar{flex-wrap:wrap;gap:10px;padding:12px 16px}.controls{gap:8px}.frame-area{height:calc(100dvh - 159px)}}@media(max-width:520px){.toolbar{padding:10px 12px}.title strong{font-size:14px}.title small{font-size:11px}.controls{width:100%;gap:5px}button,select{font-size:12px;padding:6px 9px}.reference{display:none}.frame-area{padding:8px 0 0}.frame-area[data-device=mobile] iframe{border-radius:0;width:100%;border:0}.frame-area{height:calc(100dvh - 154px)}.notes{display:none}}
  </style>
</head>
<body>
  <header class="toolbar"><div class="title"><strong>首頁 → 分校內頁 · 視覺銜接</strong><small>獨立 mock-up · 尚未套用至官網</small><div class="notes">明體校名、明亮照片、暖白留白，延續首頁分校區的視覺。</div></div><div class="controls"><label for="campus">校區</label><select id="campus"><option value="yihua">義華校</option><option value="minghua">明華校</option><option value="chongde">崇德校</option><option value="international">國際校</option><option value="renwu">仁武校</option></select><div class="segmented" aria-label="比較版本"><button data-version="proposal" aria-pressed="true">提案</button><button data-version="current" aria-pressed="false">目前內頁</button></div><div class="segmented" aria-label="預覽尺寸"><button data-device="desktop" aria-pressed="true">桌機</button><button data-device="mobile" aria-pressed="false">手機</button></div><a class="reference" href="http://127.0.0.1:3010/#campuses" target="_blank" rel="noopener">首頁參考 ↗</a><a id="open-preview" href="preview.html" target="_blank" rel="noopener">單獨開啟 ↗</a></div></header>
  <main class="frame-area" data-device="desktop"><iframe title="分校內頁 mock-up" src="preview.html?campus=yihua"></iframe></main>
  <script>
    var version='proposal',device='desktop';var select=document.getElementById('campus'),frame=document.querySelector('iframe'),area=document.querySelector('.frame-area');
    function update(){var url=version==='proposal'?'preview.html?campus='+select.value:'http://127.0.0.1:3010/campuses/'+select.value;frame.src=url;document.getElementById('open-preview').href=url;document.querySelectorAll('[data-version]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.version===version))})}
    select.addEventListener('change',update);document.querySelectorAll('[data-version]').forEach(function(b){b.addEventListener('click',function(){version=b.dataset.version;update()})});document.querySelectorAll('button[data-device]').forEach(function(b){b.addEventListener('click',function(){device=b.dataset.device;area.dataset.device=device;document.querySelectorAll('button[data-device]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.device===device))})})});
  </script>
</body>
</html>
