<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>分校線稿按鈕｜三個新方向</title>
  <link rel="icon" href="data:,">
  <style>
    :root{--paper:#f9f8f4;--ink:#3d5057;--muted:#786c5c;--rule:#d9ddd7;--surface:#ebefec}
    body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 'PingFang TC','Microsoft JhengHei',sans-serif}
    main{max-width:1180px;padding:38px 36px 30px;margin:auto}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:26px}
    h1{font:500 30px/1.5 'Songti TC','Noto Serif TC',serif;letter-spacing:.06em;margin:0 0 7px}
    p{margin:0;color:var(--muted);font-size:13px}
    .views{display:flex;gap:10px}
    button,a{font:inherit;color:inherit}
    button{background:transparent;border:1px solid var(--rule);border-radius:99px;min-height:44px;padding:6px 18px;cursor:pointer;white-space:nowrap}
    button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    :is(a,button):focus-visible{outline:2px solid var(--ink);outline-offset:4px}
    article{display:grid;grid-template-columns:210px 1fr;align-items:center;column-gap:28px;border-top:1px solid var(--rule);padding:31px 0}
    h2{margin:0 0 7px;font-size:18px;font-weight:500;letter-spacing:.04em}
    .letter{font:italic 24px Georgia,serif;color:var(--muted);margin-right:12px}
    .caption p{max-width:18em}
    .preview-link{display:inline-flex;align-items:center;min-height:44px;font-size:12px;text-decoration:underline;text-underline-offset:5px}
    .stage{display:flex;align-items:center;justify-content:center;min-width:0}
    .stage img{display:block;width:100%;height:auto}
    .stage .mobile{display:none}
    [data-view=mobile] .stage .desktop{display:none}
    [data-view=mobile] .stage .mobile{display:block;width:min(100%,342px)}
    footer{border-top:1px solid var(--rule);padding-top:18px;font-size:12px;color:var(--muted)}
    @media(max-width:700px){main{padding:24px 18px}header{display:block}.views{margin-top:15px}h1{font-size:26px}article{display:block;padding:23px 0}.caption p{max-width:none}.stage{margin-top:8px}h2{font-size:17px}}
  </style>
</head>
<body data-view="desktop">
  <main>
    <header>
      <div><h1>線稿按鈕，三個新方向</h1><p>同樣的線稿、同樣的校名，以留白與選取效果呈現不同感覺。</p></div>
      <div class="views" role="group" aria-label="比較尺寸"><button data-view="desktop" aria-pressed="true">桌機</button><button data-view="mobile" aria-pressed="false">手機</button></div>
    </header>
    <article>
      <div class="caption"><h2><span class="letter">A</span>留白短線</h2><p>校名下方一小段深色線。<br>輕、安靜，讓線稿自然展開。</p><a class="preview-link" href="preview.html?frame=a">看完整畫面 ↗</a></div>
      <a class="stage" href="preview.html?frame=a" aria-label="預覽 A 留白短線"><img class="desktop" src="screenshots/a-tabs-desktop.png" alt="A：只以校名下方短線顯示選取"><img class="mobile" src="screenshots/a-tabs-mobile.png" alt="A 手機選校列"></a>
    </article>
    <article>
      <div class="caption"><h2><span class="letter">B</span>校名膠囊</h2><p>小橢圓只包住校名。<br>線稿保有留白，選校入口清楚。</p><a class="preview-link" href="preview.html?frame=b">看完整畫面 ↗</a></div>
      <a class="stage" href="preview.html?frame=b" aria-label="預覽 B 校名膠囊"><img class="desktop" src="screenshots/b-tabs-desktop.png" alt="B：選取校名使用細線膠囊，建築線稿不加框"><img class="mobile" src="screenshots/b-tabs-mobile.png" alt="B 手機選校列"></a>
    </article>
    <article>
      <div class="caption"><h2><span class="letter">C</span>輕框卡片</h2><p>細線圓角框收住線稿與校名。<br>像一排校園小卡，選取時淡綠。</p><a class="preview-link" href="preview.html?frame=c">看完整畫面 ↗</a></div>
      <a class="stage" href="preview.html?frame=c" aria-label="預覽 C 輕框卡片"><img class="desktop" src="screenshots/c-tabs-desktop.png" alt="C：五個細線圓角框包含線稿與校名，選取校區淡綠底"><img class="mobile" src="screenshots/c-tabs-mobile.png" alt="C 手機選校列"></a>
    </article>
    <footer>三款皆可切換五校、播放輪播，點圖片或「看完整畫面」試用。獨立 mock-up，尚未套用官網。</footer>
  </main>
  <script>
    document.querySelectorAll('button[data-view]').forEach(button => button.addEventListener('click', () => {
      document.body.dataset.view = button.dataset.view;
      document.querySelectorAll('button[data-view]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
  </script>
</body>
</html>
