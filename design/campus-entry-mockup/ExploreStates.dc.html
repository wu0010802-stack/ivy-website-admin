<section style="width: 960px; min-height: 470px; background: oklch(96% .018 95); padding: 48px;">
  <span style="display: block; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; line-height: 1.8; color: oklch(48% .075 155); margin-bottom: 28px;">校區軌道與切換狀態</span>
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
    <span style="font-size: 12px; line-height: 1.8; color: oklch(47% .025 155);">由左至右：已選（實心綠）、滑鼠移入（字轉綠）、鍵盤焦點（3px 外框，縮在軌道內）、預設、預設</span>
    <div style="display: flex; align-items: center; width: 640px; padding: 6px; border-radius: 999px; background: oklch(93% .014 100);">
      <button type="button" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; line-height: 1; background: oklch(37% .057 157); color: oklch(99% .008 95); font-weight: 700;">義華校</button>
      <button type="button" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; line-height: 1; background: transparent; color: oklch(37% .057 157); font-weight: 500;">明華校</button>
      <button type="button" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; line-height: 1; background: transparent; color: oklch(31% .025 160); font-weight: 500; outline: 3px solid oklch(48% .075 155); outline-offset: -3px;">崇德校</button>
      <button type="button" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; line-height: 1; background: transparent; color: oklch(31% .025 160); font-weight: 500;">國際校</button>
      <button type="button" style="flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; line-height: 1; background: transparent; color: oklch(31% .025 160); font-weight: 500;">仁武校</button>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 40px; margin-top: 44px; align-items: start;">
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
      <span style="font-size: 12px; line-height: 1.8; color: oklch(47% .025 155);">上一校／下一校：首尾循環，不停用</span>
      <div style="display: flex; gap: 8px;"><button type="button" aria-label="上一校" class="nav" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid oklch(86% .018 145); border-radius: 50%; background: oklch(99% .008 95); color: oklch(37% .057 157); padding: 0;"><svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false" style="flex-shrink: 0; color: currentColor;"><path fill="currentColor" d="M224 128a8 8 0 0 1-8 8H59.31l58.35 58.34a8 8 0 0 1-11.32 11.32l-72-72a8 8 0 0 1 0-11.32l72-72a8 8 0 0 1 11.32 11.32L59.31 120H216a8 8 0 0 1 8 8"></path></svg></button><button type="button" aria-label="下一校" class="nav" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid oklch(86% .018 145); border-radius: 50%; background: oklch(99% .008 95); color: oklch(37% .057 157); padding: 0;"><svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false" style="flex-shrink: 0; color: currentColor;"><path fill="currentColor" d="m221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32"></path></svg></button></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; line-height: 1.8; color: oklch(47% .025 155);">切換行為</span>
      <ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; color: oklch(31% .025 160);">
        <li>軌道是 tablist：←／→／Home／End 可切換，Tab 鍵只停一個點；選中的綠色膠囊 200ms 滑到新位置。</li>
        <li>照片、資訊、地圖圖釘 200ms 淡入淡出（ease-out-quint），不用滑入；減少動態時直接切換。</li>
        <li>切換後以 aria-live 播報「目前顯示 明華校，高雄左營區」；焦點停在軌道上，不跳走。</li>
        <li>不自動輪播；「預約參觀」與「認識Ｘ校」永遠跟著目前校區。</li>
      </ul>
    </div>
  </div>
</section>
