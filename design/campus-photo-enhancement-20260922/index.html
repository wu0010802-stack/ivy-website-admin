<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五校校園圖・質感修復比較</title>
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" lang="en">IVY · CAMPUS IMAGES</p>
      <h1>校園，清晰一點。</h1>
      <p class="intro">五校圖片質感修復比較。切換校區，拖曳滑桿查看原圖與新版。</p>
    </header>
    <nav class="campuses" aria-label="選擇校區">
      <button type="button" data-key="yihua-exterior" aria-pressed="true">義華校</button>
      <button type="button" data-key="minghua" aria-pressed="false">明華校</button>
      <button type="button" data-key="chongde" aria-pressed="false">崇德校</button>
      <button type="button" data-key="international" aria-pressed="false">國際校</button>
      <button type="button" data-key="renwu" aria-pressed="false">仁武校</button>
    </nav>
    <section aria-labelledby="campus-name">
      <div class="meta"><h2 id="campus-name">義華校</h2><p id="dimensions" role="status">590 × 388 → 1546 × 1017</p></div>
      <figure>
        <div class="viewer" id="viewer">
          <img id="after" src="images/yihua-exterior-enhanced-v1.webp" width="1546" height="1017" alt="義華校 AI 質感修復版" fetchpriority="high">
          <img id="before" src="images/yihua-exterior-original.webp" width="590" height="388" alt="義華校原圖">
          <span class="tag original-tag">原圖</span><span class="tag enhanced-tag">修復版</span>
          <span class="divider" aria-hidden="true"></span>
        </div>
        <figcaption>
          <label for="split">左右比較</label>
          <input id="split" type="range" min="0" max="100" value="50" aria-label="原圖顯示比例" aria-valuetext="原圖 50%，修復版 50%">
          <div class="modes" role="group" aria-label="圖片顯示模式">
            <button type="button" data-split="100" aria-pressed="false">只看原圖</button>
            <button type="button" data-split="50" aria-pressed="true">左右比較</button>
            <button type="button" data-split="0" aria-pressed="false">只看修復版</button>
          </div>
        </figcaption>
      </figure>
      <div class="downloads"><a id="download" href="images/yihua-exterior-enhanced-v1.png" download>下載 PNG 原尺寸</a><a id="webp" href="images/yihua-exterior-enhanced-v1.webp" download>下載網頁用 WebP</a></div>
      <p class="note">這批為 AI 質感修復版，改善模糊、色偏與材質細節。AI 會重建部分窗格、招牌、人物與植栽；不能視為忠實的原始高解析照片。崇德、國際、仁武沿用原有建築示意圖方向。已確認採用，並於 2026-09-22 部署至正式官網。</p>
    </section>
    <noscript><p>互動比較需要 JavaScript；仍可直接下載上方義華修復版，其他校區檔案位於 images 目錄。</p></noscript>
  </main>
</body>
</html>
