<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>姓名貼的三種表情｜常春藤互動提案</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="mockup.js" defer></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="flip-arrow" viewBox="0 0 256 256"><path d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></symbol></svg>
  <header class="masthead">
    <a class="wordmark" href="./">常春藤<span>孩子的一天 · 互動提案</span></a>
    <span class="draft-label">姓名貼樣式研究 / 03 款</span>
  </header>
  <main>
    <div class="intro">
      <div><p class="eyebrow">從 B 姓名貼，繼續往下想。</p><h1>一張小貼紙，<br>故事就在另一面。</h1></div>
      <p class="intro-note">保留紙的溫度，也讓操作有跡可循。<br>點點看三張照片上的姓名貼，<br>感受不同的造型、提示與翻面回饋。</p>
    </div>
    <div class="toolbar">
      <div class="view-controls" role="group" aria-label="選擇比較方案">
        <button type="button" data-view="all" aria-pressed="true">一起比較</button>
        <button type="button" data-view="b1" aria-pressed="false">B1 經典</button>
        <button type="button" data-view="b2" aria-pressed="false">B2 雙欄</button>
        <button type="button" data-view="b3" aria-pressed="false">B3 索引</button>
      </div>
      <button type="button" class="all-flip" id="all-flip">一起看背面 <span aria-hidden="true">↗</span></button>
    </div>
    <div class="directions" id="directions"></div>
    <aside class="closing-note"><span class="note-mark" aria-hidden="true">＊</span><p>把可愛藏在細節，把操作說清楚。<br><span>三款皆可用點擊、觸控、Tab 與 Enter／空白鍵操作；減少動態模式會直接切換畫面。</span></p></aside>
  </main>
  <footer><span>常春藤 · 姓名貼互動比稿</span><span>獨立 mock-up，尚未套用正式網站。</span></footer>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
</body>
</html>
