<script>
(() => {
  const p = new URLSearchParams(location.search); const b = document.body;
  for (const k of ['size', 'tone']) if (p.get(k)) b.dataset[k] = p.get(k);
  const bg = p.get('bg');
  if (bg) { b.style.backgroundImage = `url(strips/${bg}.jpg)`; b.style.setProperty('--strip-w', bg.startsWith('mobile') ? '390px' : '1440px'); }
  if (p.get('menu') === 'open') {
    const header = document.querySelector('.header'), pill = document.querySelector('.header-pill'), panel = document.getElementById('menu-panel');
    pill.querySelector('.menu-toggle').setAttribute('aria-expanded', 'true'); header.dataset.menu = 'open';
    const r = pill.getBoundingClientRect(); panel.style.top = (r.bottom - 1) + 'px'; panel.style.left = r.left + 'px'; panel.style.width = r.width + 'px';
    panel.hidden = false; panel.classList.add('is-open');
  }
})();
</script>
