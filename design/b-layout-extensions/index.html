<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>常春藤｜B 版延伸提案</title><link rel="icon" href="data:,"><link rel="stylesheet" href="layouts.css"></head><body class="comparison"><main class="comparison-main"><p class="comparison-kicker">IVY EDUCATION · B SERIES</p><h1>從 B 版出發，再看三種可能。</h1><p class="comparison-intro">以 B 版左文右圖延伸，增加主文內容，保留 SINCE 1997，移除主標上方的中文小標。三版正文相同，皆維持單一段落。</p><div class="proposal-grid"><a class="proposal-card" href="b1.html"><img src="b1-desktop.png" width="1440" height="900" alt="B1 經典雙欄預覽"><div class="card-title"><h2>B1 / 經典雙欄</h2><span aria-hidden="true">↗</span></div><p>延續左右雙欄，文字與大幅方形照片平衡配置，最貼近原 B 版。</p></a><a class="proposal-card" href="b2.html"><img src="b2-desktop.png" width="1440" height="900" alt="B2 錯落雙照片預覽"><div class="card-title"><h2>B2 / 錯落雙照片</h2><span aria-hidden="true">↗</span></div><p>主照片搭配日常小照片，形成相簿般的層次，畫面較活潑。</p></a><a class="proposal-card" href="b3.html"><img src="b3-desktop.png" width="1440" height="900" alt="B3 橫向大標預覽"><div class="card-title"><h2>B3 / 橫向大標</h2><span aria-hidden="true">↗</span></div><p>主標橫跨整個版面，下方再分為文案與照片，閱讀順序更鮮明。</p></a></div><p class="comparison-note">點選任一版即可實際捲動。三版保留滿版淡綠背景與固定的「關於常春藤」背景大字；手機自動重排。</p></main></body></html>
