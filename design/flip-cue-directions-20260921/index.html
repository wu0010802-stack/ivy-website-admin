<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻面提示方向：現行／1 折角做真／2 文字圖示／1＋2／3 偷看</title>
<style>
@font-face{font-family:'LINE Seed TW';src:url(../../web/public/assets/fonts/lineseed-bd.woff) format('woff');font-weight:700}
:root{--green:oklch(38% .055 162);--deep:oklch(28% .04 162);--leaf:oklch(52% .09 158);--paper:oklch(99% .006 100);--cream:oklch(96% .02 92);--yellow:oklch(87% .13 88);--text:oklch(31% .025 160);--muted:oklch(47% .025 155);--line:oklch(86% .018 145);--ink:17 42 33;--font:'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--font-head:'LINE Seed TW','PingFang TC',sans-serif;--print-tint:var(--yellow);--face:color-mix(in oklch,var(--print-tint) 24%,oklch(99.5% .006 95));--back:color-mix(in oklch,var(--print-tint) 15%,oklch(98.5% .012 95))}
*{box-sizing:border-box}body{margin:0;background:oklch(60% .05 160);font:1rem/1.8 var(--font);color:var(--text);padding:40px}
h1{color:#fff;font:700 1.1rem/1.4 var(--font-head);margin:0 0 6px}
.lead{color:oklch(92% .02 150);font-size:.8125rem;margin:0 0 28px;max-width:70ch}
h2.row{color:#fff;font:700 .9375rem/1.4 var(--font-head);margin:48px 0 16px;padding-top:24px;border-top:1px solid rgb(255 255 255 / .25)}
.grid{display:grid;grid-template-columns:repeat(5,460px);gap:36px}
.grid.m{grid-template-columns:repeat(5,332px)}
.col h3{color:#fff;font:600 .875rem/1.5 var(--font);letter-spacing:.06em;margin:0 0 6px}
.col h3 em{font-style:normal;color:var(--yellow)}
.col p.d{color:oklch(90% .02 150);font-size:.75rem;line-height:1.7;margin:0 0 16px;min-height:5.1em}
.stack{display:grid;gap:28px}
.tools{margin:0 0 12px}.tools button{font:600 .6875rem/1 var(--font);padding:6px 10px;border-radius:100px;border:1px solid rgb(255 255 255 / .5);background:rgb(255 255 255 / .12);color:#fff;letter-spacing:.06em}
/* 拍立得（仿主站） */
.print-card{position:relative;width:460px;rotate:-2.2deg;filter:drop-shadow(0 2px 0 rgb(var(--ink) / .05)) drop-shadow(6px 18px 30px rgb(var(--ink) / .3))}
.m .print-card{width:332px}
.print-face{position:relative;background:var(--face)}
.print-front{padding:8% 8% 0}
.print-figure{position:relative;margin:0;overflow:hidden;background:var(--line)}
.print-figure img{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 40%}
.print-figure figcaption{position:absolute;left:10px;top:10px;padding:3px 8px;background:rgb(var(--ink) / .72);color:var(--paper);font-size:.5625rem;letter-spacing:.02em}
.print-foot{padding:18px 4px 46px;min-height:130px}
.m .print-foot{padding:14px 2px 44px;min-height:118px}
.print-kicker{font-size:.625rem;letter-spacing:.08em;color:var(--muted)}
.print-foot h3{margin:8px 0 0;font:700 1.5rem/1.45 var(--font-head);letter-spacing:.02em;color:var(--green);rotate:-.8deg}
.m .print-foot h3{font-size:1.25rem}
.print-back{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:32px 32px 60px;background:var(--back) repeating-linear-gradient(transparent 0 31px,rgb(var(--ink) / .07) 31px 32px)}
.print-story{font-size:.9375rem;line-height:2.1;margin:14px 0 0}
.print-ask{border-top:1px dashed rgb(var(--ink) / .25);margin-top:20px;padding-top:14px}
.print-question{font-size:.8125rem;font-weight:600;line-height:1.7;color:var(--green);margin:0}
.print-answer{font-size:.8125rem;line-height:1.95;margin:8px 0 0;color:var(--muted)}
.icon{width:1em;height:1em;fill:currentColor}
button{font:inherit;cursor:pointer}
/* 現行：整卡透明鈕＋小字＋淡折角（照 styles.css:85-91 搬） */
.turn{position:absolute;inset:0;z-index:5;display:block;width:100%;height:100%;padding:0;border:0;background:transparent;color:var(--green);text-align:left}
.hint{position:absolute;right:42px;bottom:16px;display:flex;align-items:center;gap:8px;font:400 .75rem/1.5 var(--font);letter-spacing:.06em}
.m .hint{right:38px;bottom:14px;font-size:.6875rem}
.hint .icon{width:1rem;height:1rem}
.is-flipped .hint .icon{transform:scaleX(-1)}
.corner{position:absolute;right:0;bottom:0;width:30px;height:30px;background:linear-gradient(135deg,color-mix(in oklch,var(--print-tint) 38%,var(--paper)) 0%,var(--paper) 49%,color-mix(in oklch,var(--green) 24%,var(--paper)) 51%,color-mix(in oklch,var(--print-tint) 55%,var(--paper)) 100%);clip-path:polygon(0 0,100% 100%,0 100%);rotate:180deg;filter:drop-shadow(1px 1px 1px rgb(var(--ink) / .18))}
/* 1 折角做真：相紙角真的切掉，露出後面；掀起的那一片是背面橫線紙 */
.v1 .print-face{clip-path:polygon(0 0,100% 0,100% calc(100% - var(--ear,44px)),calc(100% - var(--ear,44px)) 100%,0 100%);transition:clip-path .35s}
.v1 .is-flipped .print-face{--ear:44px}
.ear{position:absolute;right:0;bottom:0;z-index:6;width:var(--ear,44px);height:var(--ear,44px);pointer-events:none;transition:width .35s,height .35s;
  background:var(--back) repeating-linear-gradient(transparent 0 7px,rgb(var(--ink) / .09) 7px 8px);
  clip-path:polygon(0 0,100% 0,0 100%);
  filter:drop-shadow(-1px 2px 2px rgb(var(--ink) / .28))}
.ear::after{content:'';position:absolute;inset:0;background:linear-gradient(225deg,rgb(var(--ink) / .16) 0,transparent 42%),linear-gradient(45deg,rgb(255 255 255 / .55) 0,transparent 50%);clip-path:inherit}
.is-flipped .ear{background:var(--face)}
.v1 .hint{right:54px;bottom:14px}
.m .v1 .hint{right:50px}
.v1 .print-face:hover{--ear:54px}
/* 顯影完成後折角自己掀一次 */
.peel .ear{animation:ear-peek 1.1s cubic-bezier(.3,.9,.3,1) .4s both}
.peel .print-face{animation:face-peek 1.1s cubic-bezier(.3,.9,.3,1) .4s both}
@keyframes ear-peek{0%{width:30px;height:30px}55%{width:52px;height:52px}100%{width:44px;height:44px}}
@keyframes face-peek{0%{clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%)}55%{clip-path:polygon(0 0,100% 0,100% calc(100% - 52px),calc(100% - 52px) 100%,0 100%)}100%{clip-path:polygon(0 0,100% 0,100% calc(100% - 44px),calc(100% - 44px) 100%,0 100%)}}
/* 2 文字與圖示加重：13px／500、虛線底、翻面語意圖示；手機不再縮字 */
.v2 .hint,.v12 .hint{font:500 .8125rem/1.5 var(--font);letter-spacing:.04em;gap:6px;color:var(--green)}
.v2 .hint span,.v12 .hint span{border-bottom:1px dashed color-mix(in oklch,var(--green) 55%,transparent);padding-bottom:1px}
.v2 .hint .icon,.v12 .hint .icon{width:1.0625rem;height:1.0625rem;transition:transform .3s}
.v2 .turn:hover .hint .icon,.v12 .turn:hover .hint .icon{transform:translateX(2px)}
.m .v2 .hint,.m .v12 .hint{font-size:.8125rem}
/* 3 偷看：首張進場整卡微翻 10°，一次 */
.peek .print-card{transform-origin:50% 50%;animation:card-peek 1s cubic-bezier(.3,.9,.3,1) .4s both}
@keyframes card-peek{0%{transform:perspective(1200px) rotateY(0)}45%{transform:perspective(1200px) rotateY(-12deg)}100%{transform:perspective(1200px) rotateY(0)}}
</style>
</head>
<body>
<svg hidden>
<symbol id="i-arrow-counter-clockwise" viewBox="0 0 256 256"><path fill="currentColor" d="M224 128a96 96 0 0 1-94.71 96H128a95.38 95.38 0 0 1-65.9-26.2a8 8 0 0 1 11-11.63a80 80 0 1 0-1.67-114.78a3 3 0 0 1-.26.25L44.59 96H72a8 8 0 0 1 0 16H24a8 8 0 0 1-8-8V56a8 8 0 0 1 16 0v29.8L60.25 60A96 96 0 0 1 224 128"/></symbol>
<symbol id="i-arrows-left-right" viewBox="0 0 256 256"><path fill="currentColor" d="m213.66 181.66l-32 32a8 8 0 0 1-11.32-11.32L188.69 184H48a8 8 0 0 1 0-16h140.69l-18.35-18.34a8 8 0 0 1 11.32-11.32l32 32a8 8 0 0 1 0 11.32m-139.32-64a8 8 0 0 0 11.32-11.32L67.31 88H208a8 8 0 0 0 0-16H67.31l18.35-18.34a8 8 0 0 0-11.32-11.32l-32 32a8 8 0 0 0 0 11.32Z"/></symbol>
<symbol id="i-arrow-u-up-left" viewBox="0 0 256 256"><path fill="currentColor" d="M232 144a64.07 64.07 0 0 1-64 64H80a8 8 0 0 1 0-16h88a48 48 0 0 0 0-96H51.31l34.35 34.34a8 8 0 0 1-11.32 11.32l-48-48a8 8 0 0 1 0-11.32l48-48a8 8 0 0 1 11.32 11.32L51.31 80H168a64.07 64.07 0 0 1 64 64"/></symbol>
</svg>
<h1>孩子的一天：翻面提示方向</h1>
<p class="lead">現行提示是 12px／400 小字＋30px 紙色折角，折角在相紙上幾乎看不見、文字與折角也沒有連成一組。每欄上排正面、下排背面；「掀一次」與「偷看」按鈕可重播進場動效。最下一列是 390px 手機寬（卡寬 332）。</p>
<template id="card">
<div class="print-card"><div class="print-face"><div class="print-front">
<figure class="print-figure"><img src="../../web/public/assets/day-hello.webp" alt=""><figcaption>陪伴互動・入園情境示意</figcaption></figure>
<div class="print-foot"><span class="print-kicker">01 / 早安入園</span><h3>早安，今天的我<br>準備好了。</h3></div>
</div></div></div>
</template>
<template id="back">
<div class="print-back"><span class="print-kicker">01 / 早安入園</span><p class="print-story">和家人說聲再見，走進熟悉的校園。從整理小書包開始，一點一點，找到自己的步調。</p><div class="print-ask"><p class="print-question">孩子第一次上學，如何陪伴適應？</p><p class="print-answer">參觀時可以與園所聊聊：初次入園的陪伴方式、家長如何與老師聯繫，以及可以事先做哪些準備。</p></div></div>
</template>
<h2 class="row">桌機 460px</h2>
<div class="grid" id="grid"></div>
<h2 class="row">手機 390px（卡寬 332，只看正面）</h2>
<div class="grid m" id="grid-m"></div>
<script>
const ic=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const T=f=>f?'再點一下，回到照片':'點照片，看看背面';
const dirs=[
 {k:'v0',t:'現行',d:'整卡透明鈕，右下 12px 小字＋30px 紙色漸層折角，圖示是逆時針箭頭。手機縮到 11px。',
  btn:f=>`<button class="turn" type="button"><span class="hint">${T(f)}${ic('arrow-counter-clockwise')}</span><span class="corner"></span></button>`},
 {k:'v1',t:'<em>1</em> 折角做真',d:'相紙角真的切掉、掀起的那一片是背面橫線紙，帶折痕與陰影，44px。顯影完成後自己掀一次（30→60→44）；hover 掀到 54。文字貼過去靠著折角。',
  anim:'peel',
  btn:f=>`<button class="turn" type="button"><span class="hint">${T(f)}${ic('arrow-counter-clockwise')}</span></button><span class="ear"></span>`},
 {k:'v2',t:'<em>2</em> 文字與圖示加重',d:'折角不動。字 13px／500、深綠、虛線底當「可按」暗示；圖示換成左右翻（正面）與 U 型回頭（背面）；手機不再縮字。',
  btn:f=>`<button class="turn" type="button"><span class="hint"><span>${T(f)}</span>${ic(f?'arrow-u-up-left':'arrows-left-right')}</span><span class="corner"></span></button>`},
 {k:'v12',t:'<em>1＋2</em> 合併（建議）',d:'折角做真＋文字圖示加重。折角扛可供性、文字補語意，兩者右對齊成一組。',
  anim:'peel',
  btn:f=>`<button class="turn" type="button"><span class="hint"><span>${T(f)}</span>${ic(f?'arrow-u-up-left':'arrows-left-right')}</span></button><span class="ear"></span>`},
 {k:'v3',t:'<em>3</em> 首張偷看（選配）',d:'在 1＋2 之上，第一張顯影完成後整卡向左微翻 12° 再回正，一次、每次工作階段一次。DESIGN.md 寫「不自動翻面」，要你點頭才做。',
  anim:'peek',
  btn:f=>`<button class="turn" type="button"><span class="hint"><span>${T(f)}</span>${ic(f?'arrow-u-up-left':'arrows-left-right')}</span></button><span class="ear"></span>`},
];
const cls={v3:'v1 v2 v3',v12:'v1 v2',v1:'v1',v2:'v2',v0:'v0'};
function build(grid,faces){
  for(const d of dirs){
    const col=document.createElement('div');col.className='col '+cls[d.k];col.dataset.k=d.k;
    col.innerHTML=`<h3>${d.t}</h3><p class="d">${d.d}</p>`+(d.anim?`<p class="tools"><button type="button" data-replay="${d.anim}">重播${d.anim==='peel'?'掀一次':'偷看'}</button></p>`:'<p class="tools">&nbsp;</p>')+`<div class="stack"></div>`;
    const st=col.querySelector('.stack');
    for(const f of faces){
      const c=document.getElementById('card').content.cloneNode(true);
      const face=c.querySelector('.print-face');
      if(f){face.classList.add('is-flipped');face.append(document.getElementById('back').content.cloneNode(true));}
      face.insertAdjacentHTML('beforeend',d.btn(f));
      const card=c.querySelector('.print-card');
      if(d.anim&&!f)card.classList.add(d.anim);
      st.append(c);
    }
    grid.append(col);
  }
}
build(document.getElementById('grid'),[false,true]);
build(document.getElementById('grid-m'),[false]);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-replay]');if(!b)return;
  const a=b.dataset.replay;
  b.closest('.col').querySelectorAll('.print-card').forEach(c=>{c.classList.remove(a);void c.offsetWidth;c.classList.add(a);});
});
</script>
</body>
</html>
