<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>分校資訊・圓角影像輪播提案</title>
  <link rel="stylesheet" href="./preview.css">
  <script src="./preview.js" defer></script>
</head>
<body>
  <div class="preview-note"><span>分校資訊 · 互動提案</span><a href="http://127.0.0.1:3010/#campuses" target="_blank" rel="noopener">對照目前版面 ↗</a></div>
  <main>
    <section id="campuses" class="campus-gallery" aria-labelledby="campuses-heading" aria-roledescription="輪播">
      <header class="gallery-heading content-width">
        <div class="section-heading"><h1 id="campuses-heading">分校資訊</h1><span lang="en">Campuses</span></div>
        <div class="campus-tabs" role="tablist" aria-label="選擇分校"></div>
      </header>
      <div class="gallery-media">
        <div class="gallery-viewport" aria-label="校園照片，可左右滑動"><div class="gallery-track"></div></div>
        <div class="gallery-toolbar content-width">
          <div class="playback-controls">
            <div class="pagination" role="group" aria-label="分校輪播進度"></div>
            <button class="playback round-button" type="button" aria-label="暫停自動播放" aria-controls="campus-details"></button>
          </div>
        </div>
      </div>
      <div id="campus-details" class="campus-details content-width" role="tabpanel" tabindex="0"></div>
      <p class="sr-only" id="campus-live" role="status" aria-live="polite"></p>
    </section>
    <footer class="preview-footer content-width">沿用現有校園照片、品牌配色與字體。此頁為版面提案，尚未套用至官網。</footer>
  </main>
</body>
</html>
