<!doctype html>
<html lang="zh-Hant-TW">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三種方式，把日常接起來。｜常春藤轉場提案</title>
<style>
:root{--ink:#254b3c;--muted:#53675a;--paper:#faf7ef;--line:#ccd5ca;--white:#fffdf8;--selected:#e8eddf;--blue:#dce7eb;--sand:#ede0c9;--sage:#dbe6d5;--deep:#153b2e}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.7 'PingFang TC','Microsoft JhengHei',sans-serif}a{color:inherit;text-underline-offset:5px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}main{max-width:1600px;margin:auto;padding:48px 48px 70px}.mast{display:flex;justify-content:space-between;gap:20px;font-size:11px;letter-spacing:.12em;padding-bottom:22px;border-bottom:1px solid var(--line);color:var(--muted)}.intro{display:flex;align-items:end;justify-content:space-between;gap:48px;padding:30px 0}h1{margin:0;font-weight:600;font-size:clamp(28px,3.2vw,46px);line-height:1.4;letter-spacing:-.025em}.intro p{margin:0;max-width:430px;color:var(--muted);font-size:13px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.choice{display:block;padding:0;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;overflow:hidden}.choice[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:3px;background:var(--selected)}.choice img{width:100%;height:auto;display:block;aspect-ratio:1.72;object-fit:cover;object-position:top}.choice-copy{display:block;padding:18px 20px 20px}.choice-top{display:flex;gap:12px;align-items:center}.letter{font:italic 30px/1 Georgia,serif}.choice strong{font-size:18px;font-weight:600}.badge{margin-left:auto;font-size:10px;border-bottom:1px solid currentColor}.choice p{margin:10px 0 15px;color:var(--muted);font-size:12px;min-height:40px}.colours{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}.swatch{display:inline-block;inline-size:13px;block-size:13px;border-radius:50%;background:var(--colour)}.toolbar{margin-top:38px;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line)}.toolbar h2{font-size:18px;margin:0;font-weight:600}.toolbar p{font-size:12px;margin:3px 0 0;color:var(--muted)}.actions{display:flex;gap:12px;align-items:center;font-size:12px}.sizes{display:flex;gap:4px}.sizes button{min-height:44px;padding:0 15px;border:1px solid var(--line);border-radius:6px;background:none;font-size:12px}.sizes [aria-pressed=true]{background:var(--ink);color:var(--paper)}.frame-wrap{background:var(--selected);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:center;overflow:hidden}iframe{display:block;border:0;background:var(--paper);width:100%;height:860px;border-radius:4px}.frame-wrap[data-size=mobile] iframe{width:390px;max-width:100%;height:844px}.notes{display:flex;justify-content:space-between;gap:30px;font-size:11px;color:var(--muted);margin-top:18px}.notes p{margin:0;max-width:700px}@media(max-width:800px){main{padding:24px 20px 48px}.intro{display:block}.intro p{margin-top:14px}.choices{gap:14px}.choice-copy{padding:14px}.choice-top{flex-wrap:wrap;gap:8px}.choice strong{font-size:15px}.choice p{min-height:62px}.badge{margin-left:0}.colours{flex-wrap:wrap}.toolbar{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:end}.notes{display:block}.notes p+p{margin-top:10px}}@media(max-width:580px){.mast{letter-spacing:.02em;font-size:10px}.choices{grid-template-columns:1fr}.choice{display:grid;grid-template-columns:38% 1fr;align-items:stretch}.choice img{height:100%;aspect-ratio:auto;object-fit:cover;object-position:35% top}.choice p{min-height:0;margin-bottom:10px}.choice-copy{padding:14px}.letter{font-size:23px}.choice strong{font-size:16px}.toolbar{display:block}.actions{justify-content:space-between;margin-top:14px}.frame-wrap{padding:0}.toolbar p{max-width:250px}iframe{height:780px}}
</style>
</head>
<body><main>
<div class="mast"><span>常春藤教育機構 · 首頁轉場提案</span><span>2026.09.22 / 01—03</span></div>
<div class="intro"><h1>三種方式，<br>把日常接起來。</h1><p>從深綠的上一段，走進近期活動與最新消息。<br>沿用相同內容與照片，比較色面如何隨捲動交接。</p></div>
<div class="choices" role="group" aria-label="選擇轉場提案">
<button class="choice" data-direction="a" aria-pressed="true"><img src="shots/a-mid.png" width="1440" height="900" alt="A 直線揭幕，霧藍從深綠下方露出"><span class="choice-copy"><span class="choice-top"><span class="letter">A</span><strong>直線揭幕</strong><span class="badge">最推薦</span></span><p>上一層平直地退開，消息接著出現。<br>最接近 Wellington 的章節節奏。</p><span class="colours"><i class="swatch" style="--colour:var(--deep)"></i>深綠 <span>→</span><i class="swatch" style="--colour:var(--blue)"></i>霧藍</span></span></button>
<button class="choice" data-direction="b" aria-pressed="false"><img src="shots/b-mid.png" width="1440" height="900" alt="B 圓弧展開，暖米色弧面展開"><span class="choice-copy"><span class="choice-top"><span class="letter">B</span><strong>圓弧展開</strong></span><p>大圓弧由下方展開，像翻開新的一頁。<br>轉場更柔軟，也更有童年感。</p><span class="colours"><i class="swatch" style="--colour:var(--deep)"></i>深綠 <span>→</span><i class="swatch" style="--colour:var(--sand)"></i>暖米</span></span></button>
<button class="choice" data-direction="c" aria-pressed="false"><img src="shots/c-mid.png" width="1440" height="900" alt="C 整面漸染，深綠過渡成鼠尾草綠"><span class="choice-copy"><span class="choice-top"><span class="letter">C</span><strong>整面漸染</strong></span><p>底色隨捲動變亮，內容慢慢浮現。<br>沒有明顯切線，閱讀節奏最安靜。</p><span class="colours"><i class="swatch" style="--colour:var(--deep)"></i>深綠 <span>→</span><i class="swatch" style="--colour:var(--sage)"></i>鼠尾草綠</span></span></button>
</div>
<div class="toolbar"><div><h2 id="preview-title">A · 直線揭幕</h2><p>在下方捲動，或按「播放轉場」。可往上捲回看。</p></div><div class="actions"><div class="sizes" role="group" aria-label="預覽尺寸"><button data-size="desktop" aria-pressed="true">桌機</button><button data-size="mobile" aria-pressed="false">手機</button></div><a id="open-full" href="stage.html?direction=a" target="_blank" rel="noopener">全螢幕互動 ↗</a></div></div>
<div class="frame-wrap" data-size="desktop"><iframe src="stage.html?direction=a" title="A 直線揭幕互動預覽"></iframe></div>
<div class="notes"><p>獨立 mock-up，尚未整合主站。深綠起始色依提供的截圖重現；現行五校版型保留。消息與活動為設計範例。</p><p>轉場靈感：<a href="https://www.wellingtoncollege.org.uk/" target="_blank" rel="noopener">Wellington College ↗</a></p></div>
</main>
<script>
const names={a:'A · 直線揭幕',b:'B · 圓弧展開',c:'C · 整面漸染'};
const initial=new URLSearchParams(location.search).get('direction');
function select(direction){
document.querySelectorAll('[data-direction]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.direction===direction)));
document.querySelector('#preview-title').textContent=names[direction];
document.querySelector('iframe').src=`stage.html?direction=${direction}`;
document.querySelector('iframe').title=`${names[direction]}互動預覽`;
document.querySelector('#open-full').href=`stage.html?direction=${direction}`;
history.replaceState(null,'',`?direction=${direction}`);
}
document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>select(button.dataset.direction)));
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.frame-wrap').dataset.size=button.dataset.size;document.querySelectorAll('[data-size]').forEach(item=>{if(item.tagName==='BUTTON')item.setAttribute('aria-pressed',String(item===button))})}));
document.querySelector('iframe').addEventListener('load',()=>{
const direction=new URLSearchParams(document.querySelector('iframe').contentWindow.location.search).get('direction');
if(!Object.hasOwn(names,direction))return;
document.querySelectorAll('[data-direction]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.direction===direction)));
document.querySelector('#preview-title').textContent=names[direction];
document.querySelector('#open-full').href=`stage.html?direction=${direction}`;
history.replaceState(null,'',`?direction=${direction}`);
});
if(Object.hasOwn(names,initial))select(initial);
</script>
</body></html>
