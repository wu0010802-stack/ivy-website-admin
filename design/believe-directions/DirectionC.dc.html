      <h2 style="margin:0;font-family:'LINE Seed TW','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-weight:700;font-size:40px;line-height:1.55;letter-spacing:.01em;color:oklch(31% .025 160);">童年，不急著有答案。<br>先讓好奇，有地方發芽。</h2>
