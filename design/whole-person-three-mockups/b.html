<div class="proposal-content"><div class="composition"><div><p class="p-eyebrow"><span>關於常春藤</span><span lang="en">SINCE 1997</span></p><h1 class="p-title" id="proposal-title">把每個孩子，<br>放在心上。</h1><p class="p-copy">自 1997 年在高雄創立，常春藤以專業保育與溫暖陪伴，讓孩子在遊戲、閱讀與探索中快樂學習。我們重視每個孩子不同的步調，陪伴他們學會表達、合作與照顧自己，擁有充滿自信與好奇的童年。</p><a class="p-link" href="../../index.html#/home/campuses">認識五所校園<span aria-hidden="true">↗</span></a></div><figure class="b-photo"><img src="../../assets/about-curious.webp" width="760" height="570" alt="孩子在教室裡開心地指向自己的發現"><figcaption class="p-caption">每一個小小的發現，都值得被看見。</figcaption></figure></div><footer class="proposal-foot"><span>一起探索，一起長大。</span><a href="index.html">B / 左文右圖 · 比較三版 <span aria-hidden="true">↗</span></a></footer></div>
