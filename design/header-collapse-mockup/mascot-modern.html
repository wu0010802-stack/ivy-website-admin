<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>常春藤｜人物 Logo 選單・四種新結構</title>
<link rel="stylesheet" href="mascot-modern.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f1;color:#203f32;font-family:'PingFang TC','Microsoft JhengHei',sans-serif}a{color:inherit}main{width:calc(100% - 80px);max-width:1160px;margin:36px auto 26px}.intro{display:flex;align-items:end;justify-content:space-between;gap:36px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#7a8775}h1{text-wrap:balance;font-size:32px;line-height:1.4;font-weight:600;margin:10px 0 12px;letter-spacing:.02em}.intro p{font-size:12px;line-height:1.85;color:#6c7c66;margin:0}.theme-switch{display:flex;gap:5px;flex-shrink:0;border-bottom:1px solid #203f3230;padding-bottom:5px}.theme-switch button{font:inherit;font-size:11px;color:inherit;background:none;border:0;border-bottom:1px solid transparent;padding:10px 13px;cursor:pointer}.theme-switch button[aria-pressed=true]{border-bottom-color:#203f32}.studies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px}.study{min-width:0}.study-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px}.study-top h2{font-size:17px;font-weight:600;letter-spacing:.03em;margin:0;display:flex;align-items:baseline;gap:14px}.code{font-size:11px;color:#7c8874;letter-spacing:.08em;font-weight:400}.study-top em{font-style:normal;font-size:10px;color:#446b4d;padding:3px 7px;border:1px solid #203f3225;border-radius:3px}.stage{height:208px;position:relative;display:grid;place-items:center;background:#cbded2;color:#203f32;text-decoration:none;border:1px solid #203f3215;overflow:hidden;transition:background-color .2s}.stage>.modern-emblem{transform:scale(1.25)}.stage::after{content:'↗';position:absolute;right:17px;bottom:12px;font-size:19px;opacity:.4;transition:opacity .2s,transform .2s}.stage:hover::after{opacity:1;transform:translate(2px,-2px)}.stage-label{position:absolute;left:17px;top:14px;font-size:9px;letter-spacing:.13em;color:#56725d}.study-copy{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-top:12px}.study-copy p{margin:0;font-size:11px;line-height:1.8;color:#75816e}.study-copy strong{display:block;font-size:12px;font-weight:500;color:#385840;margin-bottom:2px}.study-copy small{flex-shrink:0;font-size:10px;line-height:1.8;color:#77856f;text-align:right;font-variant-numeric:tabular-nums}body[data-tone=paper] .stage{background:#eeeae0}body[data-tone=image] .stage{background:linear-gradient(#16291b88,#16291b88),url('../../assets/hero-campus-still.webp') center 48%/cover;color:#fffdf7;--halo-ink:#fffdf7}body[data-tone=image] .stage-label{color:#fffdf5b0}footer{display:flex;align-items:start;justify-content:space-between;gap:24px;border-top:1px solid #203f3226;margin-top:28px;padding-top:17px;font-size:10px;color:#798570;line-height:1.9}footer a{text-underline-offset:4px;white-space:nowrap}:focus-visible{outline:2px solid #3b6948;outline-offset:4px}.stage:focus-visible{outline-offset:-5px}
@media(max-width:800px){main{width:calc(100% - 40px);margin-top:24px}.intro{flex-direction:column;align-items:start;gap:18px}h1{font-size:27px}.studies{gap:25px 18px}.study-top h2{font-size:15px;gap:10px}.study-copy{display:block}.study-copy small{display:block;text-align:left;margin-top:7px}.study-copy p{font-size:10px}.stage{height:200px}.stage>.modern-emblem{transform:scale(1.1)}}@media(max-width:530px){main{width:calc(100% - 28px)}h1{font-size:25px}.studies{grid-template-columns:1fr;gap:27px}.stage{height:205px}.stage>.modern-emblem{transform:scale(1.25)}.study-top h2{font-size:17px}.study-copy{display:flex;gap:15px}.study-copy small{text-align:right;margin-top:0}.study-copy p{font-size:10px}footer{flex-direction:column;gap:10px}}@media(prefers-reduced-motion:reduce){.stage,.stage::after{transition:none}}
</style>
</head>
<body data-tone="sage"><main>
<header class="intro"><div><div class="eyebrow">IVY · NAVIGATION OBJECTS / 05</div><h1>熟悉的 Logo，換一種俐落的組合。</h1><p>四種新結構，讓人物和三條線共用一個選單按鈕。<br>滑過看看細微動態；點選任一款，放回網站試開抽屜。</p></div><div class="theme-switch" aria-label="比較不同頁面背景"><button data-tone="sage" aria-pressed="true">淡綠底</button><button data-tone="paper" aria-pressed="false">米白底</button><button data-tone="image" aria-pressed="false">影像底</button></div></header>
<div class="studies" id="studies"></div>
<footer><span>完整人物 Logo 原色保留 · 圖中為放大比較 · 手機按鈕等比例縮小<br>打開後沿用右側抽屜，保留預約參觀與機構社群圖示。</span><a href="mascot-ratios.html">回到人物與三條線比例比較 ↗</a></footer>
</main><script src="mascot-modern.js"></script><script>
const asset=new URL('../../assets/logo.png',location.href).href;
document.querySelector('#studies').innerHTML=IvyModernMascot.designs.map(design=>`<article class="study"><div class="study-top"><h2><span class="code">${design.code}</span>${design.name}</h2>${design.pick?`<em>${design.pick}</em>`:''}</div><a class="stage" href="drawer.html?variant=menu-only&frame=mascot&modern=${design.id}" aria-label="試用 ${design.name} 抽屜選單"><span class="stage-label">${design.english}</span>${IvyModernMascot.markup(design,asset,design.id)}</a><div class="study-copy"><p><strong>${design.note}</strong>${design.detail}</p><small>人物 ${design.logo} · 三線 ${design.lines}<br>按鈕 ${design.width} × ${design.height}</small></div></article>`).join('');
document.querySelectorAll('.theme-switch button').forEach(button=>button.onclick=()=>{document.body.dataset.tone=button.dataset.tone;document.querySelectorAll('.theme-switch button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));});
</script></body></html>
