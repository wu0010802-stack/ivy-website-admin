name: Website CI/CD

on:
  pull_request:
  push:
    branches: [production, 'feature/**', main]
  workflow_dispatch:

permissions:
  contents: read

# 正式部署不可中途被下一次 push 取消；PR/開發分支可取消過時檢查。
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: '0.8.22'
  RAILWAY_CLI_VERSION: '5.45.10'

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit -- --maxWorkers=2 --minWorkers=1
      - run: npm run build
        env:
          NUXT_WEBSITE_ENV: production
          NUXT_PUBLIC_CONTENT_MODE: live
          NUXT_PUBLIC_INDEXING_ENABLED: 'false'
          VITE_WEBSITE_ASSET_BASE: ''

  backend:
    name: Backend / PostgreSQL / contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ivy_website_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ivy_website_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install uv and media test dependency
        run: |
          python -m pip install "uv==$UV_VERSION"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
        working-directory: backend
      - name: Migrate disposable CI database
        run: uv run --frozen alembic upgrade head
        working-directory: backend
        env:
          WEBSITE_ENVIRONMENT: test
          WEBSITE_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_dev
          WEBSITE_TEST_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_test
          WEBSITE_SESSION_SECRET: ci-only-session-secret-not-for-production
      # 測試自己建立 Settings，不能注入 WEBSITE_* 來掩蓋缺少設定的情境。
      - run: uv run --frozen pytest -q
        working-directory: backend
      - name: Check production schema guard against migrated CI database
        run: uv run --frozen python ../deploy/check_schema.py
        working-directory: backend
        env:
          WEBSITE_ENVIRONMENT: test
          WEBSITE_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_dev
          WEBSITE_TEST_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_test
          WEBSITE_SESSION_SECRET: ci-only-session-secret-not-for-production
      - run: npm ci
      - run: npm run contract:check
      - name: Test deployment failure handling and snapshot boundaries
        run: python -m unittest discover -s deploy/tests -v

  # 端到端（tests/stack）：真 API＋拋棄式 PostgreSQL＋官網 production build＋後台 build，
  # 用 runner 內建的 Google Chrome 跑 Playwright。不連任何正式環境、不需要 secret；
  # 通知只寫進 runner 的本機資料夾。像素比對只在 macOS 拍的基準上做，這裡只跑流程。
  e2e:
    name: E2E / Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      E2E_DB_NAME: ivy_website_e2e_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            admin/package-lock.json
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --frozen
        working-directory: backend
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix admin ci
      - name: Check system Chrome
        run: google-chrome --version
      - name: Build admin into web, then web (same as deploy/web.Dockerfile)
        run: npm run e2e:build
      - name: Run Playwright against the full stack
        run: npm run test:e2e:stack
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-stack-report
          path: |
            playwright-report/stack
            test-results/stack
            output/e2e-stack/api-prepare.log
          retention-days: 7

  deploy:
    name: Deploy Railway production
    needs: [frontend, backend]
    if: >-
      github.repository == 'wu0010802-stack/ivy-website-admin' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://web-production-04caa.up.railway.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Prepare committed release snapshot
        run: python deploy/railway_ci.py prepare "$RUNNER_TEMP/website-release" --ref "$GITHUB_SHA"
      - name: Deploy API then web, verify release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python deploy/railway_ci.py deploy "$RUNNER_TEMP/website-release"
