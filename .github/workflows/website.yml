name: Website CI/CD

# 只改文件（*.md、docs/、design/、versions/）的提交不跑 CI、也不重新部署：程式、建置與部署
# 快照都不讀這些檔。部署紀錄類提交約占 main push 的一半（2026-10-03 統計 25 次中 14 次），
# 原本每次都完整測試＋重新部署（api 會先停舊容器），還讓下一次真正的部署排隊 20 多分鐘。
# 同一次 push 只要有一個檔案不在清單內就照跑；真要重跑用手動 Run workflow。
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'versions/**']
  push:
    branches: [production, 'feature/**', main]
    paths-ignore: ['**.md', 'docs/**', 'design/**', 'versions/**']
  workflow_dispatch:

permissions:
  contents: read

# 正式部署不可中途被下一次 push 取消；PR/開發分支可取消過時檢查。
# 同一個分支的 push 與 PR 用同一組（分支名），後到的取消先到的：原本兩邊各跑一整套
# （2026-10-14 feature/holiday-closure 的 push 與 PR 相隔 3 秒各跑 12.7 分鐘），白佔 runner、
# 讓 main 的部署排隊。PR 的來源分支叫 main（例如 fork）時改用 PR 編號，不能和正式部署同組。
concurrency:
  group: website-${{ (github.head_ref != 'main' && github.head_ref) || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: '0.8.22'
  RAILWAY_CLI_VERSION: '5.45.10'

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # 正式依賴有公告就擋下部署（2026-10-27 資安稽核，比照後端的 pip-audit）。開發用套件
      # （vitest 等）不檢查。確定不影響、又還沒有修正版時，才在這裡註明原因並暫時放寬。
      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      # web 與 admin 都是 vitest 4（web 2026-10-27 升級，admin 2026-09-29），vitest 4 移除了 --minWorkers。
      - run: npm run test:unit -- --maxWorkers=2
      - run: npm run build
        env:
          NUXT_WEBSITE_ENV: production
          NUXT_PUBLIC_CONTENT_MODE: live
          NUXT_PUBLIC_INDEXING_ENABLED: 'false'
          VITE_WEBSITE_ASSET_BASE: ''

  backend:
    name: Backend / PostgreSQL / contracts (${{ matrix.group }}/3)
    runs-on: ubuntu-24.04
    # 2026-09-30 全套 pytest 約 1040 項，平常整個 job 17–19 分鐘；慢的 runner 光 pytest 就要 21 分鐘，
    # 20 分鐘上限曾在 83%、零失敗時被取消，連帶略過部署。
    # 2026-10-03 起測試的 bcrypt 降到 rounds 4（見 tests/conftest.py），本機全套少一半以上；
    # 上限先不動，等 CI 實測穩定後再調。
    # 2026-10-05 起全套由 pytest-split 依 backend/.test_durations 分成 3 組平行跑（每組各自一個
    # postgres service，TRUNCATE 不互相干擾）：10-05 前三次 main 的 pytest 是 10.6–18.7 分鐘，
    # 是整條部署的關鍵路徑。只需要跑一次的檢查（套件漏洞、schema guard、契約、部署腳本）放在第 1 組。
    # 新增很多測試後用 `pytest --store-durations` 重產 .test_durations，分組才會平均；沒更新也能跑。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    services:
      postgres:
        # 以 digest 釘版（2026-09-29 讀自 Docker Hub 的 multi-arch index）；tag 留給人看。
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ivy_website_test
          # 拋棄式的 CI 庫不驗密碼：image 預設 TCP 走 scram-sha-256，每條新連線多約 28 ms，
          # 每個測試至少開 2 條（兩個 engine），全套累積數分鐘（2026-10-29 實測）。沒有測試依賴密碼驗證。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ivy_website_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.group == 1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # uv 本身與下載的套件都走 Actions 快取（以 backend/uv.lock 為鍵）
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # ffmpeg 原本每次（後端 3 組＋e2e）都 apt-get update 再下載安裝約百個套件（2026-10-20 改）：
      # 下載的 .deb 以 runner 映像版本為鍵存進 Actions 快取；先不 update、直接用快取裝，
      # 套件清單不在或快取對不上才照舊 update 後安裝，最差就是原本的速度。man-db 的手冊索引觸發 CI 用不到，先關掉。
      - name: ffmpeg package cache key
        id: ffmpeg-key
        run: echo "key=apt-ffmpeg-${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Install ffmpeg (media test dependency)
        run: |
          archives="$HOME/.cache/apt-ffmpeg"
          mkdir -p "$archives/partial"
          sudo rm -f /var/lib/man-db/auto-update
          opts=(-y --no-install-recommends -o "Dir::Cache::Archives=$archives" -o APT::Keep-Downloaded-Packages=true)
          if ! sudo apt-get install "${opts[@]}" ffmpeg; then
            sudo apt-get update
            sudo apt-get install "${opts[@]}" ffmpeg
          fi
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          ffmpeg -version
      - run: uv sync --frozen
        working-directory: backend
      # 執行期相依套件的已知漏洞（PyPI／OSV 公告，稽核 pillow-outdated-native-decoder-memcorrupt
      # 的後續）：Pillow 這類原生解碼器一有新公告就在這裡擋下部署。確定不影響、又還沒有
      # 修正版時，才加 --ignore-vuln <ID> 並在這裡註明原因。開發用套件（pytest 等）不檢查。
      - name: Audit runtime Python dependencies
        if: matrix.group == 1
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"
        working-directory: backend
      - name: Migrate disposable CI database
        run: uv run --frozen alembic upgrade head
        working-directory: backend
        env:
          WEBSITE_ENVIRONMENT: test
          WEBSITE_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_dev
          WEBSITE_TEST_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_test
          WEBSITE_SESSION_SECRET: ci-only-session-secret-not-for-production
      # 測試自己建立 Settings，不能注入 WEBSITE_* 來掩蓋缺少設定的情境。
      - run: uv run --frozen pytest -q --splits 3 --group ${{ matrix.group }}
        working-directory: backend
      - name: Check production schema guard against migrated CI database
        if: matrix.group == 1
        run: uv run --frozen python ../deploy/check_schema.py
        working-directory: backend
        env:
          WEBSITE_ENVIRONMENT: test
          WEBSITE_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_dev
          WEBSITE_TEST_DATABASE_URL: postgresql+asyncpg://localhost/ivy_website_test
          WEBSITE_SESSION_SECRET: ci-only-session-secret-not-for-production
      - run: npm ci
        if: matrix.group == 1
      - run: npm run contract:check
        if: matrix.group == 1
      - name: Test deployment failure handling and snapshot boundaries
        if: matrix.group == 1
        run: python -m unittest discover -s deploy/tests -v

  # 端到端（tests/stack）：真 API＋拋棄式 PostgreSQL＋官網 production build＋後台 build，
  # 用 runner 內建的 Google Chrome 跑 Playwright。不連任何正式環境、不需要 secret；
  # 通知只寫進 runner 的本機資料夾。像素比對只在 macOS 拍的基準上做，這裡只跑流程。
  e2e:
    name: E2E / Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # 以 digest 釘版（2026-09-29 讀自 Docker Hub 的 multi-arch index）；tag 留給人看。
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
          # 同後端：拋棄式的 CI 庫不驗密碼，省下每條新連線的 scram 驗證。
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      E2E_DB_NAME: ivy_website_e2e_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            admin/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # 影片上傳要 ffprobe、背景轉檔要 ffmpeg（tests/stack/media-video.spec.ts 也用它產生樣本）。
      # ffmpeg 原本每次（後端 3 組＋e2e）都 apt-get update 再下載安裝約百個套件（2026-10-20 改）：
      # 下載的 .deb 以 runner 映像版本為鍵存進 Actions 快取；先不 update、直接用快取裝，
      # 套件清單不在或快取對不上才照舊 update 後安裝，最差就是原本的速度。man-db 的手冊索引觸發 CI 用不到，先關掉。
      - name: ffmpeg package cache key
        id: ffmpeg-key
        run: echo "key=apt-ffmpeg-${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Install ffmpeg
        run: |
          archives="$HOME/.cache/apt-ffmpeg"
          mkdir -p "$archives/partial"
          sudo rm -f /var/lib/man-db/auto-update
          opts=(-y --no-install-recommends -o "Dir::Cache::Archives=$archives" -o APT::Keep-Downloaded-Packages=true)
          if ! sudo apt-get install "${opts[@]}" ffmpeg; then
            sudo apt-get update
            sudo apt-get install "${opts[@]}" ffmpeg
          fi
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          ffmpeg -version
      - run: uv sync --frozen
        working-directory: backend
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix admin ci
      - name: Check system Chrome
        run: google-chrome --version
      - name: Build admin into web, then web (same as deploy/web.Dockerfile)
        run: npm run e2e:build
      - name: Run Playwright against the full stack
        run: npm run test:e2e:stack
      # 公開站四視口（tests/e2e）：同一份 build，另起自己的 API 與測試庫（tests/e2e/e2e-env.ts）。
      # stack 紅了也照跑，兩組結果都看得到。
      - name: Run public-site Playwright (four viewports)
        if: success() || failure()
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-stack-report
          path: |
            playwright-report/stack
            playwright-report/e2e
            test-results/stack
            test-results/e2e
            output/e2e-stack/api-prepare.log
            output/e2e-public/api-prepare.log
          retention-days: 7

  deploy:
    name: Deploy Railway production
    needs: [frontend, backend]
    if: >-
      github.repository == 'wu0010802-stack/ivy-website-admin' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://web-production-04caa.up.railway.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Prepare committed release snapshot
        run: python deploy/railway_ci.py prepare "$RUNNER_TEMP/website-release" --ref "$GITHUB_SHA"
      - name: Deploy API then web, verify release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: python deploy/railway_ci.py deploy "$RUNNER_TEMP/website-release"
